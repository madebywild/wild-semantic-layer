title: Static embeddings can replace ONNX for vault search
summary: "Chrome's Modern Web Guidance replaced a native ONNX/LanceDB stack with
  pre-baked Int8 vectors, a static word-vector query embedder and BM25 fusion:
  7.1 MB package, 30 us query embed, Hit@K equal or better. Lessons: static
  averaging fails on long documents, hard cosine cutoffs drop valid results,
  measure with real queries."
evidence:
  - "Gen 3: 7.1 MB tgz, 185 ms cold search, 95.4% Hit@K vs 94.7% (TF.js MiniLM
    tuned)"
